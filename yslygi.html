<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Закажи кота на час</title>
    <!-- Подключаем красивый шрифт -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <!-- Подключаем внешний файл стилей -->
    <link rel="stylesheet" href="yslygi.css">
</head>
<body>

    <!-- Заголовок над фотографиями -->
    <h1>Закажи кота на час👇</h1>

    <!-- Контейнер с четырьмя карточками -->
    <main class="cats-container">

        <!-- Кот 1 -->
        <div class="cat-card">
            <img src="1.webp" alt="Кот Барсик">
            <p>Кот Барсик</p>
        </div>

        <!-- Кот 2 -->
        <div class="cat-card">
            <img src="2.webp" alt="Кот Мурзик">
            <p>Кот Мурзик</p>
        </div>

        <!-- Кот 3 -->
        <div class="cat-card">
            <img src="3.jpg" alt="Кот Рыжик">
            <p>Кот Рыжик</p>
        </div>

        <!-- Кот 4 -->
        <div class="cat-card">
            <img src="4.jpeg" alt="Кот Пушок">
            <p>Кот Пушок</p>
        </div>

        <!-- Кот 5 -->
        <div class="cat-card">
            <img src="5.jpg" alt="Кот Степан">
            <p>Кот Степан</p>
        </div>

        <!-- Кот 6 -->
        <div class="cat-card">
            <img src="6.jpg" alt="Кот Молёк">
            <p>Кот Молёк</p>
        </div>

        <!-- Кот 7 -->
        <div class="cat-card">
            <img src="7.jpg" alt="Кот Каша">
            <p>Кот Каша</p>
        </div>

        <!-- Кот 8 -->
        <div class="cat-card">
            <img src="8.webp" alt="Кот Бульбашик">
            <p>Кот Бульбашик</p>
        </div>

    </main>

</body>
</html>
